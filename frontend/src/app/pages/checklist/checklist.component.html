
<app-navbar></app-navbar>
<div class="checklist-container">
    <h2>📌 Minhas Tarefas (Checklist)</h2>

    <div class="task-form">
        <input type="text" [(ngModel)]="newTaskDescription" placeholder="O que você precisa fazer?">
        <input type="date" [(ngModel)]="newTaskDate">
        <button class="btn-add" (click)="addTask()">+</button>
    </div>

    <ul class="task-list">
        <li *ngFor="let task of tasks" [class.completed]="task.completed">
            <input type="checkbox" [(ngModel)]="task.completed" (change)="toggleTask(task)">
            <span>{{ task.description }}</span>
            <button class="btn-delete-icon" (click)="deleteTask(task.id)">🗑️</button>
        </li>
        <li *ngIf="tasks.length === 0" class="empty-warn">Nenhuma tarefa cadastrada.</li>
    </ul>
</div>
