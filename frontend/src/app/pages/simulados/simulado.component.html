<div class="configuracao-simulado">
    <h2>Configurar Simulado</h2>

    <div class="filtros-grid">
        <!-- 1. Ano -->
        <div class="campo-filtro">
            <label>Ano da Prova:</label>
            <select [(ngModel)]="anoSelecionado">
                <option [ngValue]="2022">2022</option>
                <option [ngValue]="2021">2021</option>
                <option [ngValue]="2020">2020</option>
                <option [ngValue]="2019">2019</option>
                <option [ngValue]="2018">2018</option>
                <option [ngValue]="2017">2017</option>
                <option [ngValue]="2016">2016</option>
                <option [ngValue]="2015">2015</option>
                <option [ngValue]="2014">2014</option>
                <option [ngValue]="2013">2013</option>
                <option [ngValue]="2012">2012</option>
                <option [ngValue]="2011">2011</option>
                <option [ngValue]="2010">2010</option>
                <option [ngValue]="2009">2009</option>
            </select>
        </div>

        <!-- 2. Dia da Prova -->
        <div class="campo-filtro">
            <label>Dia da Prova:</label>
            <select [(ngModel)]="diaSelecionado">
                <option [ngValue]="null">Prova Completa (Ambos os Dias)</option>
                <option value="DIA_1">1º Dia (Linguagens e Humanas)</option>
                <option value="DIA_2">2º Dia (Matemática e Natureza)</option>
            </select>
        </div>

        <div class="campo-filtro">
            <label>Disciplina:</label>
            <select [(ngModel)]="disciplinaSelecionada">
                <option [ngValue]="null">Todas as Disciplinas</option>
                <option value="Linguagens">Linguagens</option>
                <option value="Ciências Humanas">Ciências Humanas</option>
                <option value="Matemática">Matemática</option>
                <option value="Ciências da Natureza">Ciências da Natureza</option>
            </select>
        </div>

        <!-- 4. Idioma Estrangeiro (Condicional) -->
        <div class="campo-filtro" *ngIf="diaSelecionado === 'DIA_1' || diaSelecionado === null">
            <label>Idioma Estrangeiro:</label>
            <select [(ngModel)]="idiomaSelecionado">
                <option [ngValue]="null">Selecione o idioma...</option>
                <option value="ingles">Inglês</option>
                <option value="espanhol">Espanhol</option>
            </select>
        </div>
    </div>

    <button (click)="iniciarSimulado()" class="btn-primario btn-lg">Começar Simulado</button>
</div>
