<nav class="dashboard-nav">
    <a routerLink="/dashboard" class="nav-link active">📊 Meu Dashboard</a>
    <a routerLink="/checklist" class="nav-link">✅ Minhas Tarefas</a>
</nav>

<div class="dashboard-wrapper">

    <section class="metrics-section">
        <h2>📊 Painel de Desempenho Integrado</h2>

        <div class="metrics-grid">
            <div class="metric-card completed">
                <div class="card-icon">✅</div>
                <div class="card-info">
                    <h3>Concluídas</h3>
                    <p class="card-value">{{ metrics.completedTasks }}</p>
                </div>
            </div>

            <div class="metric-card pending">
                <div class="card-icon">⏳</div>
                <div class="card-info">
                    <h3>Pendentes</h3>
                    <p class="card-value">{{ metrics.pendingTasks }}</p>
                </div>
            </div>

            <div class="metric-card schedule">
                <div class="card-icon">📅</div>
                <div class="card-info">
                    <h3>Compromissos</h3>
                    <p class="card-value">{{ metrics.totalSchedules }}</p>
                </div>
            </div>
        </div>
    </section>

    <section class="profile-section">
        <h2>👤 Meu Perfil (Dados do Aluno)</h2>

        <div class="profile-card">
            <div class="form-group">
                <label for="name">Nome completo</label>
                <input id="name" type="text" [(ngModel)]="profileData.name" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail de acesso</label>
                <input id="email" type="email" [(ngModel)]="profileData.email" placeholder="Digite seu e-mail">
            </div>

            <div class="form-group">
                <label for="password">Nova senha de segurança</label>
                <input id="password" type="password" [(ngModel)]="profileData.password" placeholder="Mínimo 6 caracteres">
            </div>

            <button class="btn-save" (click)="submitProfileUpdate()" [disabled]="isSavingProfile">
                {{ isSavingProfile ? 'Salvando...' : 'Atualizar Dados' }}
            </button>
        </div>
    </section>

</div>
