<nav class="dashboard-nav">
    <a routerLink="/dashboard" class="nav-link" routerLinkActive="active">📊 Meu Dashboard</a>
    <a routerLink="/checklist" class="nav-link" routerLinkActive="active">✅ Minhas Tarefas</a>
    <a routerLink="/perfil" class="nav-link" routerLinkActive="active">👤 Meu Perfil</a>
</nav>

<div class="dashboard-wrapper">

    <section class="metrics-section">
        <h2>📊 Painel de Desempenho Integrado</h2>

        <div class="metrics-grid">
            <div class="metric-card completed">
                <div class="card-icon">✅</div>
                <div class="card-info">
                    <h3>Concluídas</h3>
                    <p class="card-value">{{ metrics.completedTasks }}</p>
                </div>
            </div>

            <div class="metric-card pending">
                <div class="card-icon">⏳</div>
                <div class="card-info">
                    <h3>Pendentes</h3>
                    <p class="card-value">{{ metrics.pendingTasks }}</p>
                </div>
            </div>

            <div class="metric-card schedule">
                <div class="card-icon">📅</div>
                <div class="card-info">
                    <h3>Compromissos</h3>
                    <p class="card-value">{{ metrics.totalSchedules }}</p>
                </div>
            </div>
        </div>
    </section>


</div>
